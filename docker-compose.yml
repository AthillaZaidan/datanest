services:
  platform-pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest
      POSTGRES_DB: datanest_platform
    ports:
      - "${PLATFORM_PG_PORT:-15432}:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datanest -d datanest_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  target-pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TARGET_PG_PORT:-15433}:5432"
    volumes:
      - target-data:/var/lib/postgresql/data
      - ./docker/target-init.sql:/docker-entrypoint-initdb.d/01-target-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datanest_test
      POSTGRES_PASSWORD: datanest_test
      POSTGRES_DB: datanest_test_platform
    ports:
      - "${TEST_PG_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/test-init.sql:/docker-entrypoint-initdb.d/01-test-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datanest_test -d datanest_test_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: datanest
      RABBITMQ_DEFAULT_PASS: datanest
    ports:
      - "${RABBITMQ_PORT:-15673}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./docker/observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/datanest.yaml:ro
      - ./docker/observability/dashboards:/otel-lgtm/datanest-dashboards:ro
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  platform-data:
  target-data:
  rabbitmq-data:
  lgtm-data:
